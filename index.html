<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <svg
      height="1000"
      width="1000"
      xmlns="http://www.w3.org/2000/svg"
      style="background-color: white"
    >
      <!--<line x1="100" y1="100" x2="300" y2="350" class="linie" />
      <line x1="100" y1="100" x2="100" y2="350" class="linie" />
      <line x1="100" y1="350" x2="300" y2="350" class="linie" />>-->

      <circle cx="200" cy="105" r="100" class="circle" />

      <ellipse cx="200" cy="300" rx="150" ry="75" class="ellipse"></ellipse>

      <rect x="500" y="200" width="200" height="100" class="rect"></rect>
    </svg>

    <style>
      .linie {
        stroke: black;
        stroke-width: 7px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .circle {
        fill: blue;
        stroke: green;
        stroke-width: 5px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .ellipse {
        fill: red;
        stroke: green;
        stroke-width: 5px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .rect {
        fill: yellow;
        stroke: red;
        stroke-width: 5px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </body>
</html>
